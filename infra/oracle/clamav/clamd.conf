Foreground yes
DatabaseDirectory /var/lib/clamav
PidFile /tmp/clamd.pid
LocalSocket /run/onesa-scanner/clamd.sock
LocalSocketGroup onesascan
LocalSocketMode 660
MaxThreads 1
MaxQueue 4
StreamMaxLength 12M
MaxScanSize 32M
MaxFileSize 12M
MaxRecursion 12
MaxFiles 1000
ReadTimeout 15
CommandReadTimeout 15
ConcurrentDatabaseReload no
AlertExceedsMax yes
LogFile /tmp/clamd.log
LogFileMaxSize 1M
LogTime yes
