name: IT infrastructure Worker checks
on:
  pull_request:
    paths:
      - 'infra/monitoring/it-infrastructure-worker.mjs'
      - 'infra/monitoring/it-infrastructure-worker.test.mjs'
      - '.github/workflows/it-infrastructure-worker.yml'
  push:
    branches: [dev, staging, main]
    paths:
      - 'infra/monitoring/it-infrastructure-worker.mjs'
      - 'infra/monitoring/it-infrastructure-worker.test.mjs'
      - '.github/workflows/it-infrastructure-worker.yml'
permissions:
  contents: read
jobs:
  worker-test:
    if: ${{ github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hosted runner and repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')
          test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed; rerun verification"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Test Cloudflare Worker fail-closed health classification
        run: node --test infra/monitoring/it-infrastructure-worker.test.mjs
