name: Portal verification
'on':
  schedule:
  - cron: "17 6 * * 1"
  push:
    branches:
    - main
    - staging
    - dev
  pull_request:
    branches:
    - main
    - staging
    - dev
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.verify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onesa_portal_test
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
        - 5432/tcp
        options: --health-cmd "pg_isready -U portal_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      SESSION_KEY: ci-placeholder-test-key-do-not-use-in-production-123456
      PUBLIC_ORIGIN: http://localhost:3300
      BACKEND_URL: http://127.0.0.1:8300
      NODE_ENV: test
      STORAGE_DIR: ${{ github.workspace }}/.test-storage
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Repository visibility changed; start fresh validation''; exit 1;
        }

        '
    - name: Configure disposable database connection
      env:
        POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
      run: 'database_url="postgresql://portal_test:ci-only-test-password@127.0.0.1:${POSTGRES_PORT}/onesa_portal_test"

        printf ''DATABASE_URL=%s\nTEST_DATABASE_URL=%s\n'' "$database_url" "$database_url" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install checksum-locked annotation tool
      run: python3 scripts/ci/install_tools.py --only reviewdog
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: 'onesa-company-portal-backend/package-lock.json

          onesa-company-portal-frontend/package-lock.json'
    - name: Verify system appearance, pinned foundation and measured contrast
      run: node scripts/test_system_appearance.mjs
    - name: 'Release requirement: qualification failure-path tests'
      run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
    - run: npm ci
      working-directory: onesa-company-portal-backend
    - run: npm ci
      working-directory: onesa-company-portal-frontend
    - run: python3 scripts/check-contracts.py && python3 scripts/test-contract-break.py
    - run: python3 -m unittest discover -s scripts -p test_inspect_hosting.py
    - name: Verify Oracle staging and production preparation guards
      run: python3 -m unittest discover -s scripts -p 'test_oracle*.py'
    - name: Check Oracle host-hardening script syntax
      run: |
        sh -n infra/oracle/harden-worker.sh
        sh -n infra/oracle/worker-firewall.sh
        sh -n infra/oracle/install-tailscale.sh
        sh -n infra/oracle/clamav/start.sh
        sh -n infra/oracle/clamav/health.sh
    - run: python3 -m unittest discover -s scripts/runner -p 'test_*.py'
    - run: python3 ../scripts/ci/analyze.py eslint -- node_modules/.bin/eslint --format json src tests && python3 ../scripts/ci/analyze.py
        tsc -- node_modules/.bin/tsc --pretty false && npm test && npm audit --audit-level=high
      working-directory: onesa-company-portal-backend
    - run: python3 ../scripts/ci/analyze.py eslint -- node_modules/.bin/eslint --format json src && python3 ../scripts/ci/analyze.py
        tsc -- node_modules/.bin/tsc --noEmit --pretty false && npm run test:domains && npm run build && npm audit --audit-level=high
      working-directory: onesa-company-portal-frontend
    - run: npm run documents
      working-directory: onesa-company-portal-backend
    - run: npm run seed
      working-directory: onesa-company-portal-backend
    - name: Install browsers and OS dependencies on GitHub-hosted Ubuntu
      run: npx playwright install --with-deps chromium firefox webkit
      working-directory: onesa-company-portal-frontend
    - run: "cleanup() { kill \"$backend_pid\" \"$frontend_pid\" 2>/dev/null || true; wait \"$backend_pid\" \"$frontend_pid\"\
        \ 2>/dev/null || true; }\nnode onesa-company-portal-backend/dist/src/server.js > \"$RUNNER_TEMP/portal-backend.log\"\
        \ 2>&1 &\nbackend_pid=$!\n(cd onesa-company-portal-frontend && npm start) > \"$RUNNER_TEMP/portal-frontend.log\" 2>&1\
        \ &\nfrontend_pid=$!\ntrap cleanup EXIT\nfor attempt in $(seq 1 30); do\n  if curl -fsS http://localhost:3300/en >\
        \ /dev/null; then break; fi\n  echo \"Waiting for frontend: $attempt\"\n  sleep 1\ndone\ncurl -fsS http://localhost:3300/en\
        \ > /dev/null\nnpm --prefix onesa-company-portal-frontend run test:e2e\n"
    - name: Verify production hostname boundaries and brand metadata
      working-directory: onesa-company-portal-frontend
      run: "NODE_ENV=production SITE_URL=https://onesa.eu PORTAL_URL=https://portal.onesa.eu PUBLIC_ORIGIN=https://portal.onesa.eu\
        \ BACKEND_URL=http://127.0.0.1:8362 node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3362 >\
        \ \"$RUNNER_TEMP/portal-domain-frontend.log\" 2>&1 &\ndomain_frontend_pid=$!\ntrap 'kill \"$domain_frontend_pid\"\
        \ 2>/dev/null || true' EXIT\nfor attempt in $(seq 1 30); do\n  if curl -s http://127.0.0.1:3362/ > /dev/null; then\
        \ break; fi\n  echo \"Waiting for domain frontend: $attempt\"\n  sleep 1\ndone\nnpm run test:domain-http\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        retention-days: 3
        name: verification-evidence
        path: 'onesa-company-portal-frontend/test-results

          onesa-company-portal-backend/openapi/openapi.json

          '
    permissions:
      contents: read
      pull-requests: read
    needs:
    - changes
  image-security:
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.containers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        application:
        - onesa-company-portal-backend
        - onesa-company-portal-frontend
        - clamav
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Repository visibility changed; start fresh validation''; exit 1;
        }

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build application runtime
      run: docker build -t onesa-security-candidate:${{ matrix.application }}-${{ github.run_id }} ./${{ matrix.application == 'clamav' && 'infra/oracle/clamav' || matrix.application }}
    - name: "${{ matrix.application == 'onesa-company-portal-backend' && 'Release requirement: default backend startup and database readiness' || 'Backend startup applies only to the backend image' }}"
      if: matrix.application == 'onesa-company-portal-backend'
      env:
        APPLICATION: ${{ matrix.application }}
      run: python3 scripts/startup_smoke.py "onesa-security-candidate:$APPLICATION-$GITHUB_RUN_ID"
    - name: Scan full runtime, including unfixed vendor advisories
      run: 'mkdir -p data/security

        chmod 700 data/security

        docker save onesa-security-candidate:${{ matrix.application }}-${{ github.run_id }} -o data/security/runtime.tar

        docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/tmp/trivy-cache -v "$PWD/data/security:/reports" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        image --scanners vuln,secret --format json --output /reports/runtime.json --input /reports/runtime.tar

        chmod 600 data/security/runtime.json

        python3 scripts/release/image_gate.py data/security/runtime.json

        '
    - name: 'Release requirement: record tested runtime digest'
      run: python3 scripts/release/evidence.py manifest --image "onesa-security-candidate:${{ matrix.application }}-${{ github.run_id
        }}" --output "$RUNNER_TEMP/runtime/record.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.application }}
        path: ${{ runner.temp }}/runtime/record.json
        retention-days: 7
        if-no-files-found: error
    - name: Remove restricted scan output
      if: always()
      run: rm -rf -- "$GITHUB_WORKSPACE/data/security"
    needs:
    - changes
  pipeline-security:
    uses: ./.github/workflows/_pipeline-review.yml
    permissions:
      contents: read
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      browser: ${{ steps.paths.outputs.browser }}
      documentation: ${{ steps.paths.outputs.documentation }}
      containers: ${{ steps.paths.outputs.containers }}
      tls: ${{ steps.paths.outputs.tls }}
      edge: ${{ steps.paths.outputs.edge }}
      applications: ${{ steps.paths.outputs.applications }}
      verify: ${{ steps.paths.outputs.verify }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: paths
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 scripts/ci/paths.py
  ci-summary:
    needs:
    - changes
    - pipeline-security
    - verify
    - image-security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 'Release requirement: required checks summary'
      env:
        CI_SELECTION: ${{ toJSON(needs.changes.outputs) }}
        CI_RESULTS: ${{ toJSON(needs) }}
      run: python3 scripts/ci/summary.py
