name: Approved release artifacts
'on':
  workflow_dispatch:
    inputs:
      application:
        description: Application to package independently
        type: choice
        options:
        - frontend
        - backend
        required: true
      authorization:
        description: Type approved after reviewing release gates
        required: true
permissions:
  contents: read
  checks: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-artifacts:
    if: ${{ always() && (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && (always() && true && (inputs.authorization == 'approved')) }}
    runs-on: ubuntu-latest
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Visibility changed; dispatch fresh validation under the current policy'';
        exit 1; }'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require successful verification for the selected revision
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const checks = await github.paginate(github.rest.checks.listForRef, {\n  ...context.repo, ref: context.sha,\
          \ per_page: 100\n});\nfor (const name of ['verify', 'publication-hygiene']) {\n  const check = checks.filter(item\
          \ => item.name === name).sort((a, b) => b.id - a.id)[0];\n  if (!check || check.conclusion !== 'success') core.setFailed(`Required\
          \ successful check missing: ${name}`);\n}\n"
    - name: Package selected application
      env:
        APPLICATION: ${{ inputs.application }}
      run: 'docker build -t "portal-${APPLICATION}:${GITHUB_SHA}" "./onesa-company-portal-${APPLICATION}"

        docker save "portal-${APPLICATION}:${GITHUB_SHA}" | gzip > portal-images.tar.gz

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: approved-container-images
        path: portal-images.tar.gz
        retention-days: 3
    timeout-minutes: 45
