name: Approved release artifacts
on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to package independently
        type: choice
        options: [frontend, backend]
        required: true
      authorization:
        description: 'Type approved after reviewing release gates'
        required: true
permissions:
  contents: read
  checks: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-artifacts:
    if: ${{ github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'DruHustle')) && (inputs.authorization == 'approved') }}
    environment: production
    runs-on: ubuntu-latest
    # Retain x86-64 artifact output; local emulator could not build the frontend.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful verification for the selected revision
        uses: actions/github-script@v7
        with:
          script: |
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: context.sha, per_page: 100
            });
            for (const name of ['verify', 'publication-hygiene']) {
              const check = checks.filter(item => item.name === name).sort((a, b) => b.id - a.id)[0];
              if (!check || check.conclusion !== 'success') core.setFailed(`Required successful check missing: ${name}`);
            }
      - name: Package selected application
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          docker build -t "portal-${APPLICATION}:${GITHUB_SHA}" "./onesa-company-portal-${APPLICATION}"
          docker save "portal-${APPLICATION}:${GITHUB_SHA}" | gzip > portal-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: approved-container-images
          path: portal-images.tar.gz
