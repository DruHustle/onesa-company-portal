name: Repository hygiene
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publication-hygiene:
    if: ${{ github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'DruHustle')) }}
    runs-on: [self-hosted, Linux, ARM64, onesa-portal-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/repository_hygiene.py --history

  local-runner-smoke:
    if: ${{ github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Linux, ARM64, onesa-portal-local]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: smoke-fixture-password
        ports: ['5432/tcp']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolation, runtimes and Linux service containers
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          test "$(id -un)" = portalci
          test "$(uname -m)" = aarch64
          test ! -e /Users/andrewgotora
          test -z "${SSH_AUTH_SOCK:-}"
          node --version
          python --version
          docker version
          python - <<'PYTHON'
          import os, socket
          with socket.create_connection(('127.0.0.1', int(os.environ['POSTGRES_PORT'])), timeout=5):
              print('PostgreSQL service container reachable')
          PYTHON
          printf 'Runner: %s; OS: %s; architecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
