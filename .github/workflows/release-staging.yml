name: Approved staging qualification
'on': # zizmor: ignore[dangerous-triggers] -- Owner exact main SHA and complete CI before staging-only credentials; documented in CI_CD_PIPELINE_REPORT.md
  workflow_dispatch: {}
  workflow_call: {}
  workflow_run:
    workflows:
    - Portal verification
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: approved-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && github.triggering_actor ==
      'DruHustle' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
      || (github.event_name == 'workflow_run' && github.event.repository.private == true && vars.STAGING_AUTOMATION_ENABLED
      == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name
      == github.repository && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.conclusion ==
      'success'))
    environment: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require successful exact-source checks before provider credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/release/evidence.py stage-preflight --output "$RUNNER_TEMP/technical/record.json"
    - name: Verify isolated provider targets
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
      run: python3 scripts/release/hosted.py preflight
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Build protected staging Preview with existing branch settings
      env:
        STAGING_BRANCH: staging
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
      run: 'npm install --global vercel@63.1.0

        vercel pull --yes --environment=preview --git-branch="$STAGING_BRANCH" --token="$VERCEL_TOKEN"

        VERCEL=1 vercel build --token="$VERCEL_TOKEN"

        vercel deploy --prebuilt --token="$VERCEL_TOKEN" --meta githubCommitRef="$STAGING_BRANCH" --meta githubCommitSha="$GITHUB_SHA"
        > /tmp/vercel-url.txt'
    - name: Bind only the approved staging API origin to this verified Preview
      run: python3 scripts/release/hosted.py bind-staging-origin
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Deploy exact staging backend source without database migration
      run: python3 scripts/deploy_render.py
      env:
        RENDER_RECEIPT_PATH: ${{ runner.temp }}/render/record.json
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
    - name: Verify authenticated synthetic workflows, storage and actual inference where applicable
      run: python3 scripts/release/hosted_suite.py
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Capture provider identity and real hosted probes
      run: python3 scripts/release/hosted.py stage --evidence "$RUNNER_TEMP/technical/record.json" --render-receipt "$RUNNER_TEMP/render/record.json"
        --output "$RUNNER_TEMP/staging/record.json"
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: staging-verification
        path: ${{ runner.temp }}/staging/record.json
        retention-days: 7
        if-no-files-found: error
    - name: Report outstanding acceptance honestly
      run: python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"staging/record.json").read_text());
        print("Hosted qualification:",r["status"]); print(json.dumps(r["checks"],indent=2))'
    env:
      GH_TOKEN: ${{ github.token }}
