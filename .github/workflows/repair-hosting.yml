name: Repair existing hosting configuration
'on':
  workflow_dispatch:
    inputs:
      portal_action:
        description: Targeted Portal database role operation (never deploys)
        type: choice
        default: inspect-role
        options:
        - inspect-role
        - inspect-confirmed-target
        - initialize-confirmed-target
        - repair-role
        - repair-layout
        - repair-staging-layout
        - repair-staging-database
        - repair-staging-preview
permissions:
  contents: read
  actions: read
concurrency:
  group: portal-database-role-repair
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.event.repository.private == false && (always() && true && (github.repository == 'DruHustle/onesa-company-portal'
      && github.actor == 'DruHustle' && inputs.portal_action != 'repair-staging-layout' && inputs.portal_action != 'repair-staging-database' && inputs.portal_action != 'repair-staging-preview' && (github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'DruHustle'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      PORTAL_MIGRATION_DATABASE_URL: ${{ secrets.PORTAL_MIGRATION_DATABASE_URL }}
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Repository visibility changed; start fresh validation''; exit 1;
        }

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Require successful checks before database changes
      if: inputs.portal_action == 'repair-role' || inputs.portal_action == 'initialize-confirmed-target'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const allowed = '${{ inputs.portal_action }}' === 'initialize-confirmed-target'\n  ? ['refs/heads/main']\n\
          \  : ['refs/heads/main'];\nif (!allowed.includes(context.ref)) throw new\
          \ Error('Approved Portal operator branch required');\nconst {owner, repo} = context.repo;\nfor (const workflow_id\
          \ of ['verify.yml', 'repository-hygiene.yml']) {\n  const runs = await github.rest.actions.listWorkflowRuns({owner,\
          \ repo, workflow_id, head_sha: context.sha, event: 'push', per_page: 20});\n  const run = runs.data.workflow_runs[0];\n\
          \  if (!run || run.status !== 'completed' || run.conclusion !== 'success') throw new Error(`${workflow_id} must\
          \ pass for this repair revision`);\n}\n"
    - run: npm ci
      working-directory: onesa-company-portal-backend
    - name: Inspect identified Portal schema and role without revealing credentials
      if: inputs.portal_action == 'inspect-role'
      working-directory: onesa-company-portal-backend
      run: node --import tsx src/services/render-role-repair.ts
    - name: Inspect the owner-confirmed alternate Portal target without changing databases
      if: inputs.portal_action == 'inspect-confirmed-target'
      working-directory: onesa-company-portal-backend
      run: node --import tsx src/services/render-role-repair.ts --inspect-confirmed-target
    - name: Provision and verify a restricted role then save only the API runtime URL
      if: inputs.portal_action == 'repair-role'
      working-directory: onesa-company-portal-backend
      run: node --import tsx src/services/render-role-repair.ts --apply
    - name: Initialize only the confirmed empty database; leave Render runtime untouched
      if: inputs.portal_action == 'initialize-confirmed-target'
      working-directory: onesa-company-portal-backend
      env:
        PORTAL_APP_DB_PASSWORD: ${{ secrets.PORTAL_APP_DB_PASSWORD }}
      run: node --import tsx src/services/render-role-repair.ts --initialize-confirmed-target
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      if: inputs.portal_action == 'repair-layout'
      with:
        python-version: '3.11'
    - name: Repair existing main hosting layout without deploying
      if: inputs.portal_action == 'repair-layout'
      env:
        RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: 'python scripts/repair_hosting.py

        python scripts/inspect_hosting.py

        '
  staging-layout:
    if: ${{ github.event.repository.private == false && (always() && true && (github.repository == 'DruHustle/onesa-company-portal'
      && github.actor == 'DruHustle' && inputs.portal_action == 'repair-staging-layout')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Repository visibility changed; start fresh validation''; exit 1;
        }

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Require exact-source staging audit checks
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "if (context.ref !== 'refs/heads/staging') throw new Error('Identified Portal audit\
          \ branch required');\nconst {owner, repo} = context.repo;\nfor (const workflow_id of ['verify.yml', 'repository-hygiene.yml'])\
          \ {\n  const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, head_sha: context.sha,\
          \ event: 'push', per_page: 20});\n  const run = runs.data.workflow_runs[0];\n  if (!run || run.status !== 'completed'\
          \ || run.conclusion !== 'success') throw new Error(`${workflow_id} must pass on this staging repair revision`);\n\
          }\n"
    - name: Repair only the existing free staging API layout without deploying
      env:
        PORTAL_REPAIR_SCOPE: staging
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      run: python scripts/repair_hosting.py
  staging-database:
    if: github.event.repository.private == false && github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && github.ref == 'refs/heads/staging' && inputs.portal_action == 'repair-staging-database'
    environment: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Require successful exact-source checks before staging credentials
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          if (process.env.RUNNER_ENVIRONMENT !== 'github-hosted' || context.ref !== 'refs/heads/staging') throw new Error('Identified hosted staging operator required');
          const {owner, repo} = context.repo;
          const repository = await github.rest.repos.get({owner, repo});
          if (repository.data.private !== false) throw new Error('Repository visibility changed; qualify fresh operator execution');
          const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/staging'});
          if (ref.data.object.sha !== context.sha) throw new Error('Staging source changed');
          for (const workflow_id of ['verify.yml', 'repository-hygiene.yml']) {
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, head_sha: context.sha, event: 'push', per_page: 20});
            const run = runs.data.workflow_runs[0];
            if (!run || run.head_sha !== context.sha || run.head_branch !== 'staging' || run.head_repository.full_name !== context.payload.repository.full_name || run.status !== 'completed' || run.conclusion !== 'success') throw new Error(`${workflow_id} must pass on this exact staging revision`);
          }
    - run: npm ci
      working-directory: onesa-company-portal-backend
    - name: Bind only the existing restricted database login to verified free staging
      working-directory: onesa-company-portal-backend
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        PORTAL_APP_DB_PASSWORD: ${{ secrets.PORTAL_APP_DB_PASSWORD }}
      run: node --import tsx src/services/render-role-repair.ts --repair-staging-database

  staging-preview:
    if: github.event.repository.private == false && github.repository == 'DruHustle/onesa-company-portal' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && github.ref == 'refs/heads/dev' && inputs.portal_action == 'repair-staging-preview'
    environment: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require current development and staging source checks before settings changes
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          const {owner, repo}=context.repo;
          if(process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new Error('Hosted owner operation required');
          const repository=await github.rest.repos.get({owner,repo});
          if(repository.data.private !== false) throw new Error('Visibility changed');
          for(const branch of ['dev','staging']) {
            const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            const sha=ref.data.object.sha;
            if(branch === 'dev' && sha !== context.sha) throw new Error('Development source changed');
            for(const workflow_id of ['verify.yml','repository-hygiene.yml']) {
              const runs=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,head_sha:sha,event:'push',per_page:20});
              const run=runs.data.workflow_runs[0];
              if(!run || run.head_sha !== sha || run.head_branch !== branch || run.head_repository.full_name !== context.payload.repository.full_name || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Complete source checks required');
            }
          }
    - name: Save only the identified staging branch API and server proxy bindings
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
        STAGING_FIXTURE_MODE: temporary
      run: python3 scripts/release/hosted.py configure-staging-preview
