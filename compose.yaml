name: onesa-company-portal
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onesa_portal
      POSTGRES_USER: onesa_portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/bootstrap-env.py}
    ports:
      - '127.0.0.1:${DATABASE_PORT:-55440}:5432'
    volumes:
      - portal_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onesa_portal -d onesa_portal']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 512m
volumes:
  portal_database:
